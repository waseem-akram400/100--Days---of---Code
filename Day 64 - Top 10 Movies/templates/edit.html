<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Movie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <main class="container">
        <h1>Edit: {{ movie.title }}</h1>

        <form method="post" class="movie-form">
            <label for="rating">Your Rating (0–10) *</label>
            <input id="rating" name="rating" type="number"
                   min="0" max="10" step="0.1"
                   value="{{ movie.rating if movie.rating is not none else '' }}"
                   required>

            <label for="review">Your Review</label>
            <textarea id="review" name="review" rows="5">{{ movie.review or '' }}</textarea>

            <button type="submit">Save Changes</button>
        </form>

        <a href="{{ url_for('home') }}">← Back to Movie List</a>
    </main>
</body>
</html>
