{% extends "base.html" %}

{% block title %}Form Received | Day 61{% endblock %}

{% block content %}
<div class="form-card mx-auto">
    <h1 class="text-success">Form Submitted Successfully!</h1>
    <p><strong>Name:</strong> {{ name }}</p>
    <p><strong>Email:</strong> {{ email }}</p>
    <p><strong>Message:</strong></p>
    <p class="message-box">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('contact') }}">
        Back to Form
    </a>
</div>
{% endblock %}
