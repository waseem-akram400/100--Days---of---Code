<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit a Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <main class="container">
        <h1>Edit Book</h1>

        <form method="post" class="book-form">
            <label for="title">Book Title</label>
            <input id="title" name="title" value="{{ book.title }}" required>

            <label for="author">Author</label>
            <input id="author" name="author" value="{{ book.author }}" required>

            <label for="rating">Your Rating (0–10)</label>
            <input id="rating" name="rating" type="number"
                   min="0" max="10" step="0.1"
                   value="{{ book.rating }}" required>

            <button type="submit">Update Book</button>
        </form>

        <a href="{{ url_for('home') }}">Back to Bookshelf</a>
    </main>
</body>
</html>
