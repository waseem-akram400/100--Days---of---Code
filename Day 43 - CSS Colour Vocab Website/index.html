
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spanish Colour Vocabulary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Spanish Colours</h1>

    <h2>Learn the names of colours in Spanish!</h2>

    <div class="colour-card">
        <h2>Rojo</h2>
        <p>Red</p>
        <div class="colour-box" id="red"></div>
    </div>

    <div class="colour-card">
        <h2>Azul</h2>
        <p>Blue</p>
        <div class="colour-box" id="blue"></div>
    </div>

    <div class="colour-card">
        <h2>Verde</h2>
        <p>Green</p>
        <div class="colour-box" id="green"></div>
    </div>

    <div class="colour-card">
        <h2>Amarillo</h2>
        <p>Yellow</p>
        <div class="colour-box" id="yellow"></div>
    </div>

    <div class="colour-card">
        <h2>Negro</h2>
        <p>Black</p>
        <div class="colour-box" id="black"></div>
    </div>

</body>
</html>
